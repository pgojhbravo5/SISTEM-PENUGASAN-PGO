<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sistem Syif PGO</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#b3261e">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef1f5;--card:rgba(255,255,255,.55);--field:rgba(255,255,255,.6);--tx:#1b2430;--mut:#5f6b79;--bd:rgba(255,255,255,.7);--ln:rgba(27,36,48,.1);--ok:#1a7f4b;--bad:#c62828;--pri:#b3261e;--sh:0 8px 28px rgba(40,50,70,.12);--b1:rgba(179,38,30,.28);--b2:rgba(60,110,220,.25);--b3:rgba(26,127,75,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1115;--card:rgba(34,42,52,.55);--field:rgba(255,255,255,.07);--tx:#e8ecf0;--mut:#98a3af;--bd:rgba(255,255,255,.14);--ln:rgba(255,255,255,.1);--ok:#4cc58a;--bad:#ff6b6b;--pri:#e0554a;--sh:0 8px 28px rgba(0,0,0,.45);--b1:rgba(224,85,74,.3);--b2:rgba(70,120,230,.28);--b3:rgba(76,197,138,.16)}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:12px 12px calc(104px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));max-width:640px;margin-inline:auto;min-height:100vh;
  background:radial-gradient(circle at 12% 8%,var(--b1),transparent 45%),radial-gradient(circle at 92% 30%,var(--b2),transparent 45%),radial-gradient(circle at 25% 95%,var(--b3),transparent 50%);background-attachment:fixed}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:1.15rem;margin:0}h2{font-size:1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
select,input,button{font:inherit;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--field);color:var(--tx);width:100%;margin-top:8px}
select,input{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button{cursor:pointer;font-weight:600}button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:8px}.row button{margin-top:8px}
.in{background:var(--ok);color:#fff;border:0}.out{background:var(--bad);color:#fff;border:0}.pri{background:var(--pri);color:#fff;border:0}
.big{font-size:2.4rem;font-weight:700;line-height:1}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:.85rem}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;font-weight:400}th{color:var(--mut);font-size:.85rem}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}li:last-child{border:0}
#app{display:none}
.tab{display:none}.tab.on{display:block}
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:616px;margin-inline:auto;background:var(--tx);color:var(--bg);padding:12px;border-radius:14px;display:none;z-index:5}
#alarm{position:fixed;inset:0;background:var(--pri);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9;animation:b 1s steps(2) infinite}
#alarm.on{display:flex}#alarm button{background:#fff;color:var(--pri);margin-top:24px;max-width:320px;font-size:1.2rem}
@keyframes b{50%{filter:brightness(.7)}}
@media(prefers-reduced-motion:reduce){#alarm{animation:none}}
/* Tab bawah (glass) */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin-inline:auto;z-index:4;display:flex;gap:4px;padding:6px;border-radius:28px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.tabs button{flex:1;margin:0;width:auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:0;border-radius:22px;background:transparent;color:var(--tx);font-size:.72rem;font-weight:600;transition:background .2s,color .2s}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--field);color:var(--pri);box-shadow:inset 0 0 0 1px var(--bd)}
/* Jadual rujukan */
:root{--c-rehat:#2f62c9;--c-makan:#a86400;--c-tidur:#7248bd}
@media(prefers-color-scheme:dark){:root{--c-rehat:#7fa6ff;--c-makan:#f0b955;--c-tidur:#b995ff}}
.sesi{display:flex;align-items:center;gap:8px;margin:14px 0 4px}.sesi:first-of-type{margin-top:2px}
.sesi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sesi b{font-size:1.02rem}
.rt{table-layout:fixed;border-collapse:separate;border-spacing:0 4px}
.rt th{border:0;padding:2px 6px;font-size:.72rem;font-weight:600;color:var(--mut)}
.rt td{border:0;padding:8px 6px;background:var(--field);vertical-align:middle;font-size:.75rem;font-variant-numeric:tabular-nums;line-height:1.35;white-space:nowrap}
.rt td:first-child{border-radius:10px 0 0 10px;font-weight:700;font-size:.82rem;padding-left:8px}
.rt td:last-child{border-radius:0 10px 10px 0}
.rt .k{color:var(--bad);font-weight:600}
.rt small{display:block;font-size:.7rem;font-weight:700;margin-bottom:1px}
.rt .rehat small{color:var(--c-rehat)}.rt .makan small{color:var(--c-makan)}.rt .tidur small{color:var(--c-tidur)}
.nota{margin-top:12px;font-size:.85rem;color:var(--mut)}.nota div{padding:4px 0}.nota b{color:var(--tx);margin-right:6px}
.rt.jd td:not(:first-child),.rt.jd th:not(:first-child){text-align:center}
.rt.jd td:first-child{font-weight:600;font-size:.82rem}
.rt.jd th small{display:block;font-weight:400;font-size:.68rem}
.sf{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:700;font-size:.9rem}
.sf.A{background:rgba(179,38,30,.15);color:var(--pri)}.sf.B{background:rgba(47,98,201,.15);color:var(--c-rehat)}.sf.C{background:rgba(26,127,75,.16);color:var(--ok)}
.sf.now{box-shadow:0 0 0 2px var(--pri)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap;background:var(--field);border:1px solid var(--bd)}
.chip.sk{color:var(--pri)}
.lg .chip{margin-left:auto}
.av.sm{width:38px;height:38px;font-size:.72rem}.av.off{background:rgba(120,130,145,.16);color:var(--mut)}
/* Susun atur Utama dan Jadual */
.hd{align-items:flex-start;margin-bottom:12px}.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{padding:3px 10px;border-radius:999px;background:var(--field);border:1px solid var(--bd);font-size:.8rem;white-space:nowrap}
.keluar{color:var(--mut);font-size:.82rem;text-decoration:none;padding:3px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--field)}
.ph,.sh,.sb{display:flex;justify-content:space-between;align-items:center;gap:8px}.sh{align-items:flex-start;margin-bottom:12px}.sb{margin-bottom:6px}
.chip:empty{display:none}
.chip.on,.chip.g{background:rgba(26,127,75,.16);color:var(--ok);border-color:transparent}
.chip.k{background:rgba(198,40,40,.14);color:var(--bad);border-color:transparent}
.chip.offc{color:var(--mut)}
.row button{flex:1}
.slot2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{border-radius:12px;padding:8px 12px;background:rgba(80,120,220,.14)}
.tl.makan{background:rgba(230,160,40,.18)}.tl.tidur{background:rgba(130,90,210,.18)}.tl.ganti{background:rgba(120,130,145,.16)}
.tl small{display:block;font-size:.75rem;font-weight:700;color:var(--c-rehat)}.tl.makan small{color:var(--c-makan)}.tl.tidur small{color:var(--c-tidur)}.tl.ganti small{color:var(--mut)}
.tl b{font-variant-numeric:tabular-nums;font-size:1.05rem}
.tl.selesai{opacity:.45}.tl.kini{box-shadow:0 0 0 2px var(--ok)}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.pt{border-radius:12px;padding:8px 12px;background:var(--field);border:1px solid var(--bd)}
.pt small{display:block;color:var(--mut);font-size:.75rem}.pt.kosong b{color:var(--bad)}.pt.me{box-shadow:0 0 0 2px var(--pri)}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:12px}.sf.big{width:64px;height:64px;font-size:1.8rem;flex:none}
.lain{margin-top:10px;border-top:1px solid var(--ln);padding-top:10px}.lain summary{cursor:pointer;font-weight:600;color:var(--mut);font-size:.9rem}
/* Log terkini */
.lg{align-items:center;justify-content:flex-start;gap:12px;padding:9px 0}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.av.in{background:rgba(26,127,75,.16);color:var(--ok)}.av.out{background:rgba(198,40,40,.14);color:var(--bad)}
.lg .who{flex:1;min-width:0}.lg .who b{display:block}.lg .who span{font-size:.85rem}
.lg .when{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.lg .when b{font-variant-numeric:tabular-nums}.lg .when span{font-size:.8rem}
/* Penapis bilangan bertugas */
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--field);border:1px solid var(--bd);margin:4px 0 10px}
.seg button{flex:1;width:auto;margin:0;padding:8px 4px;border:0;border-radius:12px;background:transparent;color:var(--mut);font-size:.85rem}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:inset 0 0 0 1px var(--bd)}
.rt td[colspan]{font-size:.75rem;font-weight:600}
</style>
</head>
<body>
<div id="toast"></div>
<div id="alarm"><div class="big">ALARM</div><p id="alarmMsg" style="font-size:1.3rem"></p><button id="alarmOff">Matikan alarm</button></div>

<div id="login" class="card" style="margin-top:12vh">
  <h1>Syif PGO Johor</h1>
  <input id="lid" placeholder="ID (contoh: A01)" autocapitalize="characters" autocomplete="username">
  <input id="lpw" type="password" placeholder="Kata laluan" autocomplete="current-password">
  <button id="bMasuk" class="pri">Log masuk</button>
  <p id="lerr" class="bad"></p>
</div>

<div id="app">

<!-- TAB 1: Syif PGO Johor + Stesen saya -->
<section id="t1" class="tab on">
<header class="hd">
  <div><h1>Syif PGO Johor</h1><p class="mut" style="margin:2px 0 0">Log masuk: <b id="kod"></b> · Syif <span id="mykump"></span></p></div>
  <div class="hr"><span class="pill"><span id="conn" class="mut">○ Menyambung...</span></span><a href="#" id="keluar" class="keluar">Keluar</a></div>
</header>
<button id="aktif" class="pri" style="margin:0 0 6px">Aktifkan bunyi dan notifikasi</button>
<p id="pushStatus" class="mut" style="margin:0 0 12px"></p>

<div class="card">
  <div class="ph"><h2 style="margin:0">Punch</h2><span id="status" class="chip"></span></div>
  <div id="timer" class="big mut" style="font-size:3.4rem;font-variant-numeric:tabular-nums;text-align:center;margin:14px 0 4px;letter-spacing:.02em">00:00:00</div>
  <p id="timerLbl" class="mut" style="margin:0 0 6px;text-align:center"></p>
  <select id="pilihStesen" aria-label="Pilih stesen"></select>
  <button id="bIn" class="in">Punch In</button>
  <div class="row"><button id="bTukar" style="display:none">Tukar stesen</button><button id="bOut" class="out">Punch Out</button></div>
</div>

<div class="card">
  <div class="sh"><div><span class="mut">Stesen saya</span><div id="stesenSaya" class="big" style="font-size:1.8rem;margin-top:2px">-</div></div><span id="krit" class="chip"></span></div>
  <div id="rehatSaya" class="slot2"></div>
  <h2 style="margin-top:18px">Penugasan semasa</h2>
  <div id="penugasan" class="pn"></div>
</div>
</section>

<!-- TAB 2: Jadual syif + Sedang bertugas -->
<section id="t2" class="tab">
<div class="card">
  <h2>Jadual syif</h2>
  <div class="hero"><span id="sfBadge" class="sf big"></span><div><div id="semasa" style="font-size:1.4rem;font-weight:700;line-height:1.2"></div><p id="seterus" class="mut" style="margin:4px 0 0"></p></div></div>
  <table id="jadual" class="rt jd"></table>
</div>

<div class="card">
  <div class="sb"><div><h2 style="margin:0">Sedang bertugas</h2><span class="mut">minimum <span id="min"></span> orang</span></div><span id="cnt" class="big">0</span></div>
  <p id="warn" class="bad" style="font-weight:600;margin:6px 0"></p>
  <ul id="senarai"></ul>
  <details id="lain" class="lain"><summary>Anggota lain (<span id="nLain">0</span>)</summary><ul id="senaraiLain"></ul></details>
</div>
</section>

<!-- TAB 3: Jadual rujukan -->
<section id="t3" class="tab">
  <div class="card">
    <h2>Rujukan ikut bilangan bertugas</h2>
    
    <div class="seg" id="segN" role="group" aria-label="Bilangan anggota bertugas">
      <button data-n="5">5 orang</button>
      <button data-n="4">4 orang</button>
      <button data-n="3">3 orang</button>
    </div>
    <div id="rujN"></div>
  </div>
  </section>

<!-- TAB 4: Log terkini -->
<section id="t4" class="tab">
<div class="card"><h2>Log terkini</h2><ul id="log"></ul></div>
</section>

<!-- TAB 5: Hantar notifikasi -->
<section id="t5" class="tab">
<div class="card">
  <h2>Hantar notifikasi</h2>
  <input id="mesej" placeholder="Mesej untuk semua anggota">
  <div class="row"><button id="bInfo">Notifikasi</button><button id="bAlarm" class="pri">Alarm</button></div>
</div>
</section>

<nav class="tabs" aria-label="Menu utama">
  <button data-tab="t1" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>Utama</button>
  <button data-tab="t2"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Jadual</button>
  <button data-tab="t3"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Rujukan</button>
  <button data-tab="t4"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Log</button>
  <button data-tab="t5"><svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 21h4"/></svg>Notifikasi</button>
</nav>
</div>

<script src="config.js"></script>
<script>
// ====== TETAPAN: SUPABASE_URL, SUPABASE_KEY dan VAPID_PUBLIC diisi dalam config.js ======
const MIN = 3; // minimum anggota bertugas
// =====================
const KONFIG_OK = typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_KEY !== 'undefined' &&
  !SUPABASE_URL.includes('XXXX') && !SUPABASE_KEY.includes('ANON_PUBLIC');
const db = KONFIG_OK ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const MSG_KONFIG = 'Tetapan Supabase belum diisi. Isi config.js dan deploy semula.';
const $ = s => document.querySelector(s);
let anggota = [], logs = [], last = {}, me = null, ac = null, alarmTimer = null, subscribed = false, sibuk = false;
$('#min').textContent = MIN;

// ===== Tab =====
function bukaTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === id));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  window.scrollTo(0, 0);
  try { sessionStorage.setItem('tab', id); } catch (_) {}
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => bukaTab(b.dataset.tab));
try { const t = sessionStorage.getItem('tab'); if (t && document.getElementById(t)) bukaTab(t); } catch (_) {}

const fmt = t => new Date(t).toLocaleString('ms-MY', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'});
const nama = id => (anggota.find(a => a.id === id) || {}).nama || '?';
const bertugas = () => anggota.filter(a => last[a.id] && last[a.id].jenis === 'IN');

// ===== Login =====
async function masuk() {
  if (!db) { $('#lerr').textContent = MSG_KONFIG; return; }
  const id = $('#lid').value.trim().toLowerCase();
  $('#lerr').textContent = '';
  const {error} = await db.auth.signInWithPassword({email: id + '@pgo.local', password: $('#lpw').value});
  if (error) $('#lerr').textContent = /invalid login/i.test(error.message) ? 'ID atau kata laluan salah' : 'Ralat: ' + error.message;
  else boot();
}
$('#bMasuk').onclick = masuk;
$('#lpw').onkeydown = e => { if (e.key === 'Enter') masuk(); };
$('#keluar').onclick = async e => {
  e.preventDefault();
  try {
    const reg = await navigator.serviceWorker.getRegistration(), sub = reg && await reg.pushManager.getSubscription();
    if (sub) { await db.rpc('padam_push', {p_endpoint: sub.endpoint}); await sub.unsubscribe(); }
  } catch (_) {}
  await db.auth.signOut(); location.reload();
};

async function boot() {
  if (!db) { $('#lerr').textContent = MSG_KONFIG; return; }
  const {data: {session}} = await db.auth.getSession();
  if (!session) { $('#login').style.display = 'block'; $('#app').style.display = 'none'; return; }
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  semakIzin();
  await load();
  me = anggota.find(a => a.user_id === session.user.id);
  if (!me) { alert(`Akaun ini belum dipautkan dengan anggota. Anggota dibaca: ${anggota.length}, ID akaun: ${session.user.id}`); return; }
  $('#kod').textContent = me.kod || me.nama;
  $('#mykump').textContent = me.kumpulan || '-';
  render();
  rujukanN(Math.min(5, Math.max(3, bertugas().length)));
  if (!subscribed) { subscribed = true; langgan(); }
  daftarPush();
}

// ===== Data =====
async function load() {
  const [a, p] = await Promise.all([
    db.from('anggota').select('*').eq('aktif', true).order('kod'),
    db.from('punch').select('*').order('masa', {ascending: false}).limit(300)
  ]);
  if (a.error) alert('Gagal baca jadual anggota: ' + a.error.message);
  if (p.error) console.warn('Gagal baca punch:', p.error.message);
  anggota = a.data || []; logs = p.data || []; last = {};
  [...logs].reverse().forEach(x => last[x.anggota_id] = x);
  render();
}

function render() {
  const on = bertugas();
  $('#cnt').textContent = on.length;
  $('#cnt').className = 'big ' + (on.length >= MIN ? 'ok' : 'bad');
  $('#warn').textContent = on.length < MIN ? `Amaran: kurang daripada minimum ${MIN} orang` : '';
  const sk = kump(Date.now()), msk = a => !!(last[a.id] && last[a.id].jenis === 'IN');
  const baris = a => { const l = last[a.id], dalam = msk(a);
    return `<li class="lg"><span class="av sm ${dalam ? 'in' : 'off'}">${(a.kod || a.nama || '').slice(0, 3)}</span>
      <div class="who"><b>${a.nama}</b><span class="${dalam ? 'ok' : 'mut'}">${dalam ? (l.stesen || 'Bertugas') + ' · sejak ' + jam(l.masa) : 'Tidak bertugas'}</span></div>
      ${a.kumpulan === sk ? '<span class="chip sk">Syif semasa</span>' : ''}</li>`; };
  const lain = anggota.filter(a => !msk(a)).sort((x, y) => (y.kumpulan === sk) - (x.kumpulan === sk));
  $('#senarai').innerHTML = on.map(baris).join('') || '<li class="mut">Tiada anggota bertugas</li>';
  $('#senaraiLain').innerHTML = lain.map(baris).join('');
  $('#nLain').textContent = lain.length;
  $('#lain').style.display = lain.length ? 'block' : 'none';
  $('#log').innerHTML = logs.slice(0, 15).map(l => {
    const msk = l.jenis === 'IN';
    return `<li class="lg"><span class="av ${msk ? 'in' : 'out'}">${l.jenis}</span>
      <div class="who"><b>${nama(l.anggota_id)}</b><span class="mut">${msk ? 'Punch In' + (l.stesen ? ' · ' + l.stesen : '') : 'Punch Out'}</span></div>
      <div class="when"><b>${jam(l.masa)}</b><span class="mut">${new Date(l.masa).toLocaleDateString('ms-MY', {day: '2-digit', month: 'short'})}</span></div></li>`;
  }).join('') || '<li class="mut">Tiada log.</li>';
  const l = me && last[me.id], dalam = l && l.jenis === 'IN';
  const stt = $('#status'); stt.textContent = !me ? '' : dalam ? 'Bertugas' : 'Tidak bertugas'; stt.className = 'chip ' + (dalam ? 'on' : 'offc');
  $('#bIn').disabled = !me || dalam;
  $('#bOut').disabled = !me || !dalam;
  $('#bIn').style.display = dalam ? 'none' : 'block';
  $('#bOut').style.display = dalam ? 'block' : 'none';
  pilihanStesen();
  stesen();
  timer();
}

// ===== Timer tempoh bertugas (Punch In hingga Punch Out) =====
function tempohTugas(id) { // 'Tukar stesen' tidak menetapkan semula timer
  const mine = logs.filter(x => x.anggota_id === id); // terbaru dahulu
  let i = 0, tamat = null, mula = null;
  if (mine[0] && mine[0].jenis === 'OUT') { tamat = new Date(mine[0].masa).getTime(); i = 1; }
  if (!mine[i] || mine[i].jenis !== 'IN') return null;
  for (; i < mine.length && mine[i].jenis === 'IN'; i++) mula = new Date(mine[i].masa).getTime();
  return {mula, tamat};
}
const hms = ms => {
  const s = Math.max(0, Math.floor(ms / 1000)), p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(s / 3600))}:${p(Math.floor(s % 3600 / 60))}:${p(s % 60)}`;
};
function timer() {
  if (!me) return;
  const el = $('#timer'), lbl = $('#timerLbl'), t = tempohTugas(me.id);
  if (!t) { el.textContent = '00:00:00'; el.className = 'big mut'; lbl.textContent = 'Timer bermula bila Punch In'; return; }
  if (t.tamat) {
    el.textContent = hms(t.tamat - t.mula); el.className = 'big mut';
    lbl.textContent = 'Tempoh bertugas terakhir · ' + jam(t.mula) + '–' + jam(t.tamat);
  } else {
    el.textContent = hms(Date.now() - t.mula); el.className = 'big ok';
    lbl.textContent = 'Bertugas sejak ' + jam(t.mula);
  }
}
setInterval(timer, 1000);

async function punch(jenis, st) {
  if (!me) return;
  if (jenis === 'IN') {
    if (!st) return alert('Pilih stesen dahulu');
    const n = bertugas().filter(a => a.id !== me.id).length + 1;
    if (!bukaStesen(n).includes(st) && !confirm(`Stesen ${st} ditutup bila ${n} orang bertugas. Teruskan?`)) return;
  }
  if (sibuk) return;
  sibuk = true;
  try {
    const row = {anggota_id: me.id, jenis, stesen: jenis === 'IN' ? st : null};
    const {error} = await db.from('punch').insert(row);
    if (error) alert('Gagal: ' + error.message);
  } finally { sibuk = false; }
}
$('#bIn').onclick = () => punch('IN', $('#pilihStesen').value);
$('#bTukar').onclick = () => {
  const st = $('#pilihStesen').value;
  if (last[me.id] && last[me.id].stesen === st) return alert('Anda sudah di stesen ini');
  punch('IN', st);
};
$('#bOut').onclick = () => punch('OUT');

async function hantar(jenis) {
  const m = $('#mesej').value.trim();
  if (!m || !me) return;
  const {error} = await db.from('notifikasi').insert({jenis, mesej: m, dari: me.nama});
  if (error) return alert('Gagal: ' + error.message);
  $('#mesej').value = '';
}
$('#bInfo').onclick = () => hantar('info');
$('#bAlarm').onclick = () => hantar('alarm');

// ===== Bunyi, alarm, notifikasi =====
function beep(ms = 200) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = 880; g.gain.value = .25;
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + ms / 1000);
}
function startAlarm(m) {
  clearInterval(alarmTimer);
  $('#alarmMsg').textContent = m;
  $('#alarm').classList.add('on');
  alarmTimer = setInterval(() => { beep(350); navigator.vibrate && navigator.vibrate(350); }, 700);
}
$('#alarmOff').onclick = () => { clearInterval(alarmTimer); $('#alarm').classList.remove('on'); };

let tt;
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 5000);
}
function notify(n, sys) {
  const tajuk = n.jenis === 'alarm' ? 'ALARM' : 'Notifikasi';
  toast(`${tajuk}: ${n.mesej}${n.dari ? ' (' + n.dari + ')' : ''}`);
  if (n.jenis === 'alarm') startAlarm(n.mesej); else { beep(250); navigator.vibrate && navigator.vibrate(200); }
  if (sys && 'Notification' in window && Notification.permission === 'granted') // peringatan setempat
    navigator.serviceWorker.getRegistration().then(r => r && r.showNotification(tajuk + ' - Syif PGO', {body: n.mesej, icon: 'icon-192.png', vibrate: [200, 100, 200]}));
}
$('#aktif').onclick = async () => {
  const izin = 'Notification' in window ? Notification.requestPermission() : null; // mesti terus dalam klik
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();
  beep(150);
  $('#aktif').style.display = 'none';
  await izin;
  daftarPush();
};

// ===== Izin notifikasi: jangan minta berulang kali =====
function semakIzin() {
  const b = $('#aktif');
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') b.style.display = 'none';
  else if (Notification.permission === 'denied') { b.textContent = 'Notifikasi disekat. Benarkan di tetapan pelayar'; b.style.display = 'block'; }
}
function bukaAudio() { // pelayar hanya benarkan bunyi selepas sentuhan pertama
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (_) {}
}
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, bukaAudio, {once: true}));

// ===== Web Push =====
const b64 = k => Uint8Array.from(atob((k + '='.repeat((4 - k.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function daftarPush() { // dipanggil setiap kali log masuk atau buka app; status dipaparkan di bawah butang
  const st = m => { const el = $('#pushStatus'); if (el) el.textContent = m; };
  try {
    if (!me) return;
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    if (ios && !standalone) return st('iPhone: tekan Kongsi > Tambah ke Skrin Utama, buka dari ikon itu, kemudian tekan Aktifkan.');
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return st('Push tidak disokong pada pelayar ini.');
        if (!('Notification' in window) || Notification.permission !== 'granted') return st('Push belum aktif. Tekan butang Aktifkan di atas.');
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLIC)});
    const j = sub.toJSON();
    const {error} = await db.rpc('daftar_push', {p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_kunci: j.keys.auth});
    st(error ? 'Push gagal didaftar: ' + error.message : 'Push aktif: notifikasi sampai walaupun app ditutup');
  } catch (e) { console.warn('Push:', e); st('Push gagal: ' + (e.message || e)); }
}

// ===== Realtime =====
function langgan() {
  db.channel('pgo')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'punch'}, p => {
      if (p.eventType !== 'INSERT') return load();
      logs.unshift(p.new); last[p.new.anggota_id] = p.new; render();
      toast(`${nama(p.new.anggota_id)} Punch ${p.new.jenis}`);
      if (p.new.jenis === 'OUT' && bertugas().length < MIN)
        notify({jenis: 'info', mesej: `Anggota bertugas tinggal ${bertugas().length}, kurang daripada minimum ${MIN}`});
    })
    .on('postgres_changes', {event: '*', schema: 'public', table: 'anggota'}, load)
    .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'notifikasi'}, p => notify(p.new))
    .subscribe(s => {
      $('#conn').textContent = s === 'SUBSCRIBED' ? '● Live' : '○ ' + s;
      $('#conn').className = s === 'SUBSCRIBED' ? 'ok' : 'mut';
    });
}

// ===== Rotasi syif: slot 12 jam, urutan B → C → A =====
// Rujukan: 23 Nov 2026 jam 0800 = Syif B (siang)
const ANCHOR = new Date('2026-11-23T08:00:00+08:00').getTime(), SLOT = 43200000, URUTAN = ['B', 'C', 'A'];
const idx = t => Math.floor((t - ANCHOR) / SLOT);
const kump = t => URUTAN[((idx(t) % 3) + 3) % 3];
const jenisSlot = t => ((idx(t) % 2) + 2) % 2 === 0 ? 'Siang' : 'Malam';
const jam = t => new Date(t).toLocaleTimeString('ms-MY', {hour: '2-digit', minute: '2-digit', hour12: false});

function jadual() {
  const now = Date.now(), tamat = ANCHOR + (idx(now) + 1) * SLOT;
  const k0 = kump(now), sisa = tamat - now;
  $('#sfBadge').className = 'sf big ' + k0; $('#sfBadge').textContent = k0;
  $('#semasa').textContent = `Syif ${k0} · ${jenisSlot(now)}`;
  $('#seterus').innerHTML = `Tamat ${jam(tamat)} · tinggal ${Math.floor(sisa / 3600000)}j ${Math.floor(sisa % 3600000 / 60000)}m<br>Seterusnya: Syif ${kump(tamat)} (${jenisSlot(tamat)})`;
  const d0 = ANCHOR + Math.floor((now - ANCHOR) / 86400000) * 86400000, ci = idx(now);
  let h = '<colgroup><col style="width:40%"><col style="width:30%"><col style="width:30%"></colgroup><tr><th>Tarikh</th><th>Siang<small>08:00–20:00</small></th><th>Malam<small>20:00–08:00</small></th></tr>';
  for (let k = 0; k < 7; k++) {
    const d = d0 + k * 86400000, sa = kump(d), sb = kump(d + SLOT);
    h += `<tr><td>${new Date(d).toLocaleDateString('ms-MY', {weekday: 'short', day: 'numeric', month: 'short'})}</td>
      <td><span class="sf ${sa}${idx(d) === ci ? ' now' : ''}">${sa}</span></td>
      <td><span class="sf ${sb}${idx(d + SLOT) === ci ? ' now' : ''}">${sb}</span></td></tr>`;
  }
  $('#jadual').innerHTML = h;
}
let diingat = 0;
function ingatan() { // peringatan 15 minit sebelum pertukaran syif
  const now = Date.now(), tamat = ANCHOR + (idx(now) + 1) * SLOT;
  if (me && tamat - now <= 900000 && diingat !== tamat) {
    diingat = tamat;
    notify({jenis: 'info', mesej: `Syif bertukar jam ${jam(tamat)}: Syif ${kump(tamat)} ambil alih`}, true);
  }
}
// ===== Stesen dan jadual rehat (tetap ikut stesen) =====
// 5 orang: semua stesen jalan, MERS 2 ada kerja sendiri (tidak ganti). 4 orang: MERS 2 tutup. 3 orang: SPI juga tutup.
const REHAT = {
  Siang: {
    'RT': [['Rehat', '1000', '1030'], ['Makan', '1200', '1300']],
    'PGO': [['Rehat', '1030', '1100'], ['Makan', '1300', '1400']],
    'SPI': [['Rehat', '1100', '1130'], ['Makan', '1400', '1500']],
    'MERS 1': [['Rehat', '1130', '1200'], ['Makan', '1500', '1600']],
    'MERS 2': [['Makan', '1600', '1700'], ['Rehat', '1700', '1730']]
  },
  Malam: {
    'PGO': [['Makan', '2030', '2100'], ['Tidur', '0030', '0200']],
    'SPI': [['Makan', '2100', '2130'], ['Tidur', '0200', '0330']],
    'MERS 1': [['Makan', '2130', '2200'], ['Tidur', '2300', '0030']],
    'RT': [['Makan', '2200', '2230'], ['Tidur', '0330', '0500']],
    'MERS 2': [['Makan', '2230', '2300'], ['Tidur', '0500', '0630']]
  }
};
const KRITIKAL = {
  'PGO': ['1530-1600', '2330-0030', '0530-0630'],
  'SPI': ['1800-2000', '0600-0800'],
  'RT': ['0800-1000', '2000-2200'],
  'MERS 1': ['1800-2000', '0400-0600'],
  'MERS 2': []
};
const jf = h => h.slice(0, 2) + ':' + h.slice(2);
const mnt = h => +h.slice(0, 2) * 60 + +h.slice(2, 4);
const dalamSlot = (jenis, a) => (a >= 480 && a < 1200) === (jenis === 'Siang');

function slotTs(mula, jenis, a, b) { // masa mula/tamat dalam slot semasa (ms)
  const base = jenis === 'Siang' ? 480 : 1200;
  const ra = (mnt(a) - base + 1440) % 1440;
  let rb = (mnt(b) - base + 1440) % 1440; if (rb <= ra) rb += 1440;
  return [mula + ra * 60000, mula + rb * 60000];
}

const STESEN_SEMUA = ['PGO', 'SPI', 'RT', 'MERS 1', 'MERS 2'];
const KEUTAMAAN = ['PGO', 'RT', 'MERS 1', 'SPI', 'MERS 2']; // MERS 2 ditutup dahulu, kemudian SPI
const bukaStesen = n => n >= 5 ? STESEN_SEMUA : n === 4 ? ['PGO', 'SPI', 'RT', 'MERS 1'] : ['PGO', 'RT', 'MERS 1'];

function penugasan() { // ikut stesen yang dipilih anggota semasa Punch In
  const ons = bertugas().sort((x, y) => (x.kod || '').localeCompare(y.kod || '')), map = {};
  ons.forEach(a => map[a.id] = last[a.id].stesen || 'Belum pilih');
  return {buka: bukaStesen(ons.length), map, ons};
}

function pilihanStesen() { // senarai pilihan: stesen yang sudah diambil orang lain dikunci
  if (!me) return;
  const sel = $('#pilihStesen'), cur = sel.value, l = last[me.id], dalam = l && l.jenis === 'IN', ambil = {};
  bertugas().forEach(a => { if (a.id !== me.id && last[a.id].stesen) ambil[last[a.id].stesen] = a; });
  sel.innerHTML = STESEN_SEMUA.map(s => `<option value="${s}"${ambil[s] ? ' disabled' : ''}>${s}${ambil[s] ? ' (' + ambil[s].nama + ')' : ''}</option>`).join('');
  sel.value = cur && !ambil[cur] ? cur : dalam && l.stesen ? l.stesen : (KEUTAMAAN.find(s => !ambil[s]) || '');
  $('#bTukar').style.display = dalam ? 'block' : 'none';
}

function slotSaya(st, p, jenis, mula) {
  const r = (REHAT[jenis][st] || []).map(x => x.slice());
  return r.map(([j, a, b]) => { const [s, e] = slotTs(mula, jenis, a, b); return {j, a, b, s, e}; }).sort((x, y) => x.s - y.s);
}

function stesen() {
  if (!me) return;
  const now = Date.now(), mula = ANCHOR + idx(now) * SLOT, jenis = jenisSlot(now), p = penugasan(), st = p.map[me.id];
  $('#penugasan').innerHTML = STESEN_SEMUA.filter(s => p.buka.includes(s) || p.ons.some(x => p.map[x.id] === s)).map(s => {
    const a = p.ons.find(x => p.map[x.id] === s);
    return `<div class="pt${a ? '' : ' kosong'}${a && a.id === me.id ? ' me' : ''}"><small>${s}</small><b>${a ? a.nama : 'Kosong'}</b></div>`;
  }).join('');
  $('#stesenSaya').textContent = st || '-';
  const kr = $('#krit');
  if (!st) { kr.className = 'chip'; kr.textContent = 'Punch In dahulu'; $('#rehatSaya').innerHTML = ''; return; }
  const c = new Date(now), cur = c.getHours() * 60 + c.getMinutes();
  const kritis = (KRITIKAL[st] || []).some(w => {
    const a = mnt(w.slice(0, 4)), b = mnt(w.slice(5));
    return a <= b ? cur >= a && cur < b : cur >= a || cur < b;
  });
  kr.className = 'chip ' + (kritis ? 'k' : 'g'); kr.textContent = kritis ? 'Waktu kritikal' : 'Bukan waktu kritikal';
  $('#rehatSaya').innerHTML = slotSaya(st, p, jenis, mula).map(x => {
    const tp = x.j.startsWith('Ganti') ? 'ganti' : x.j.toLowerCase(), sl = now >= x.e ? ' selesai' : now >= x.s ? ' kini' : '';
    return `<div class="tl ${tp}${sl}"><small>${x.j}${now >= x.e ? ' · selesai' : now >= x.s ? ' · sekarang' : ''}</small><b>${jf(x.a)}–${jf(x.b)}</b></div>`;
  }).join('') || '<span class="mut">Tiada slot rehat</span>';
}

const dingat = new Set();
function ingatRehat() { // notifikasi 5 minit sebelum dan bila tamat
  if (!me) return;
  const now = Date.now(), mula = ANCHOR + idx(now) * SLOT, jenis = jenisSlot(now), p = penugasan(), st = p.map[me.id];
  if (!st) return;
  slotSaya(st, p, jenis, mula).forEach(x => {
    const k = mula + x.j + x.a;
    if (now >= x.s - 300000 && now < x.s && !dingat.has(k + 's')) {
      dingat.add(k + 's');
      notify({jenis: 'info', mesej: `${x.j} ${x.a}-${x.b} (stesen ${st}) bermula 5 minit lagi`}, true);
    }
    if (now >= x.e && now < x.e + 120000 && !dingat.has(k + 'e')) {
      dingat.add(k + 'e');
      notify({jenis: 'info', mesej: `${x.j} tamat. Kembali ke stesen ${st}`}, true);
    }
  });
}

const IKON_SESI = {
  Siang: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',
  Malam: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>'
};

// ===== Rujukan ikut bilangan bertugas (penapis 5 / 4 / 3 orang) =====
const NOTA_N = {
  5: 'Semua 5 stesen jalan. MERS 2 ada kerja sendiri dan tidak ganti stesen lain. Bila satu stesen rehat, baki 4 orang masih cukup.',
  4: 'MERS 2 tutup. Bila satu stesen rehat, baki 3 orang masih cukup minimum.',
  3: 'SPI dan MERS 2 tutup. Rehat perlu relief atau standby kerana baki 2 orang bawah minimum 3.'
};
let nRuj = 5;
function rujukanN(n) {
  nRuj = n;
  document.querySelectorAll('#segN button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  const buka = bukaStesen(n), tutup = STESEN_SEMUA.filter(s => !buka.includes(s));
  const t = jenis => {
    let h = `<div class="sesi">${IKON_SESI[jenis]}<b>${jenis}</b><span class="mut">${jenis === 'Siang' ? '08:00–20:00' : '20:00–08:00'}</span></div>
    <table class="rt"><colgroup><col style="width:19%"><col style="width:27%"><col style="width:27%"><col style="width:27%"></colgroup>
      <tr><th>Stesen</th><th>Kritikal</th><th>Slot 1</th><th>Slot 2</th></tr>`;
    h += STESEN_SEMUA.map(s => {
      if (!buka.includes(s)) return `<tr><td>${s}</td><td colspan="3" class="mut">Ditutup</td></tr>`;
      const kr = KRITIKAL[s].filter(w => dalamSlot(jenis, mnt(w.slice(0, 4))));
      return `<tr><td>${s}</td><td class="k">${kr.map(w => jf(w.slice(0, 4)) + '–' + jf(w.slice(5))).join('<br>') || '<span class="mut">' + (s === 'MERS 2' ? 'Kerja sendiri' : '-') + '</span>'}</td>` +
        REHAT[jenis][s].map(([nm, a, b]) => `<td class="${nm.toLowerCase()}"><small>${nm}</small>${jf(a)}–${jf(b)}</td>`).join('') + '</tr>';
    }).join('') + '</table>';
    return h;
  };
  $('#rujN').innerHTML = t('Siang') + t('Malam') + `<div class="nota">
    <div><b>${n} orang</b>${NOTA_N[n]}</div>
    ${tutup.length ? `<div><b>Ditutup</b>${tutup.join(', ')}</div>` : ''}</div>`;
}
document.querySelectorAll('#segN button').forEach(b => b.onclick = () => rujukanN(+b.dataset.n));

jadual();
rujukanN(5);
setInterval(() => { jadual(); ingatan(); ingatRehat(); stesen(); }, 30000);

// Ketuk notifikasi alarm: buka skrin alarm yang berbunyi berulang
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'alarm') startAlarm(e.data.mesej); });
const qa = new URLSearchParams(location.search).get('alarm');
if (qa) { startAlarm(qa); history.replaceState(null, '', location.pathname); }

boot();
</script>
